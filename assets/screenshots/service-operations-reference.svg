    <text x="500" y="431" class="label">服务与现象</text>
    <text x="724" y="431" class="label">证据</text>
    <text x="866" y="431" class="label">状态</text>

    <rect x="286" y="455" width="676" height="98" rx="12" fill="#f0fdfa" stroke="#5eead4"/>
    <rect x="286" y="455" width="5" height="98" rx="2.5" fill="#14b8a6"/>
    <text x="304" y="480" fill="#0f766e" font-size="12" font-weight="750">QRY-DEMO-204</text>
    <rect x="304" y="492" width="47" height="20" rx="10" fill="#ffe4e6"/>
    <text x="327" y="506" text-anchor="middle" fill="#be123c" font-size="9" font-weight="750">高</text>
    <text x="500" y="480" fill="#0f172a" font-size="13" font-weight="700">星河结算服务</text>
    <text x="500" y="501" class="body">请求延迟升高</text>
    <text x="500" y="523" class="small">演示区域-2 · 09:42</text>
    <text x="724" y="480" fill="#0f172a" font-size="13" font-weight="700">2 个来源</text>
    <text x="724" y="503" class="small">覆盖率 96%</text>
    <rect x="866" y="477" width="72" height="24" rx="12" fill="#ccfbf1"/>
    <text x="902" y="493" text-anchor="middle" fill="#0f766e" font-size="9" font-weight="750">待确认</text>
    <text x="866" y="524" class="small">AI 建议已生成</text>

    <line x1="302" y1="573" x2="946" y2="573" stroke="#e2e8f0"/>
    <text x="304" y="601" fill="#334155" font-size="12" font-weight="700">QRY-DEMO-203</text>
    <rect x="304" y="614" width="58" height="20" rx="10" fill="#fef3c7"/>
    <text x="333" y="628" text-anchor="middle" fill="#92400e" font-size="9" font-weight="750">中</text>
    <text x="500" y="601" fill="#0f172a" font-size="13" font-weight="650">星云搜索服务</text>
    <text x="500" y="623" class="body">间歇性超时</text>
    <text x="500" y="645" class="small">演示区域-1 · 09:31</text>
    <text x="724" y="601" fill="#0f172a" font-size="13" font-weight="650">1 个来源</text>
    <text x="724" y="624" class="small">覆盖率 73%</text>
    <rect x="866" y="597" width="72" height="24" rx="12" fill="#e0f2fe"/>
    <text x="902" y="613" text-anchor="middle" fill="#0369a1" font-size="9" font-weight="750">补充信息</text>

    <line x1="302" y1="675" x2="946" y2="675" stroke="#e2e8f0"/>
    <text x="304" y="703" fill="#334155" font-size="12" font-weight="700">QRY-DEMO-202</text>
    <rect x="304" y="716" width="48" height="20" rx="10" fill="#e2e8f0"/>
    <text x="328" y="730" text-anchor="middle" fill="#475569" font-size="9" font-weight="750">低</text>
    <text x="500" y="703" fill="#0f172a" font-size="13" font-weight="650">极光报表服务</text>
    <text x="500" y="725" class="body">定时任务完成延迟</text>
    <text x="500" y="747" class="small">演示区域-4 · 09:14</text>
    <text x="724" y="703" fill="#0f172a" font-size="13" font-weight="650">3 个来源</text>
    <text x="724" y="726" class="small">覆盖率 89%</text>
    <rect x="866" y="699" width="72" height="24" rx="12" fill="#f1f5f9"/>
    <text x="902" y="715" text-anchor="middle" fill="#475569" font-size="9" font-weight="750">观察中</text>

    <rect x="290" y="788" width="648" height="42" rx="11" fill="#f8fafc"/>
    <text x="310" y="814" fill="#64748b" font-size="11">显示 7 条虚构问题中的 3 条</text>
    <text x="914" y="814" text-anchor="end" fill="#0f766e" font-size="11" font-weight="700">查看全部 →</text>

    <!-- 分析面板 -->
    <g filter="url(#shadow)"><rect x="1006" y="326" width="398" height="526" rx="18" fill="#fff"/></g>
    <text x="1032" y="362" class="h2">AI 辅助分析</text>
    <rect x="1278" y="342" width="98" height="25" rx="12.5" fill="#fef3c7"/>
    <text x="1327" y="359" text-anchor="middle" fill="#92400e" font-size="9" font-weight="750">仅供辅助</text>
    <text x="1032" y="385" class="small">QRY-DEMO-204 · 当前问题</text>

    <text x="1032" y="422" class="label">已知事实</text>
    <circle cx="1036" cy="447" r="4" fill="#14b8a6"/>
    <text x="1050" y="451" class="body">延迟高于虚构基线</text>
    <circle cx="1036" cy="473" r="4" fill="#14b8a6"/>
    <text x="1050" y="477" class="body">09:26 存在已批准的配置变更</text>
    <circle cx="1036" cy="499" r="4" fill="#14b8a6"/>
    <text x="1050" y="503" class="body">错误率仍在演示阈值内</text>

    <line x1="1032" y1="526" x2="1378" y2="526" stroke="#e2e8f0"/>
    <text x="1032" y="557" class="label">主要假设 · 中等置信</text>
    <text x="1032" y="581" fill="#0f172a" font-size="13" font-weight="650">配置变更后下游依赖出现资源饱和</text>
    <text x="1032" y="603" class="small">AI 推断，需要负责人员确认</text>

    <text x="1032" y="639" class="label">支持证据</text>
    <rect x="1032" y="653" width="160" height="31" rx="9" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="1045" y="673" fill="#0e7490" font-size="10" font-weight="700">RUNBOOK-DEMO-17 · v3</text>
    <rect x="1202" y="653" width="145" height="31" rx="9" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="1215" y="673" fill="#0f766e" font-size="10" font-weight="700">KB-DEMO-201 · v2</text>

    <text x="1032" y="719" class="label">建议排查步骤</text>
    <rect x="1032" y="734" width="346" height="56" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="1048" y="758" class="body">对比下游依赖延迟与虚构基线，</text>
    <text x="1048" y="778" class="body">并确认最近一次配置变更。</text>

    <rect x="1032" y="805" width="165" height="30" rx="10" fill="#fff" stroke="#94a3b8"/>
    <text x="1115" y="825" text-anchor="middle" fill="#334155" font-size="10" font-weight="700">查看证据</text>
    <rect x="1207" y="805" width="171" height="30" rx="10" fill="url(#teal)"/>
    <text x="1292" y="825" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">人工确认后创建任务</text>

    <text x="1402" y="884" text-anchor="end" fill="#64748b" font-size="10">独立设计的参考 Mockup · 全部内容均为虚构</text>
  </g>
</svg>

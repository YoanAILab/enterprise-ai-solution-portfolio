    <text x="290" y="362" class="h2">最近服务问题</text>
    <text x="290" y="384" class="small">先检索已审核知识，再生成辅助分析</text>
    <rect x="829" y="345" width="126" height="34" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="892" y="366" text-anchor="middle" fill="#334155" font-size="11" font-weight="650">筛选问题</text>

    <rect x="286" y="407" width="676" height="38" rx="8" fill="#f8fafc"/>

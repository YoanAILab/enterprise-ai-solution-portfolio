<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">服务运营参考界面</title>
  <desc id="desc">使用虚构数据展示服务问题、检索证据、AI 原因假设和人工确认边界。</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1426"/>
      <stop offset="1" stop-color="#142944"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .ui { font-family: "Microsoft YaHei", "Noto Sans SC", "Segoe UI", Arial, sans-serif; }
      .label { fill: #64748b; font-size: 12px; font-weight: 600; letter-spacing: .5px; }
      .body { fill: #334155; font-size: 13px; }
      .small { fill: #64748b; font-size: 11px; }
      .h1 { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .h2 { fill: #0f172a; font-size: 17px; font-weight: 700; }
      .metric { fill: #0f172a; font-size: 28px; font-weight: 750; }
    </style>
  </defs>

  <g class="ui">
    <rect width="1440" height="900" fill="#eef3f8"/>

    <!-- 左侧导航 -->
    <rect width="228" height="900" fill="#091321"/>
    <rect x="24" y="26" width="42" height="42" rx="13" fill="url(#teal)"/>
    <path d="M36 47h18M45 38v18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="78" y="45" fill="#f8fafc" font-size="15" font-weight="700">企业 AI 方案</text>
    <text x="78" y="62" fill="#7dd3fc" font-size="10" font-weight="600">服务运营能力</text>

    <rect x="20" y="104" width="188" height="42" rx="11" fill="#17334a"/>
    <circle cx="42" cy="125" r="6" fill="#2dd4bf"/>
    <text x="60" y="130" fill="#f8fafc" font-size="13" font-weight="650">运营概览</text>
    <circle cx="42" cy="174" r="6" fill="#475569"/>
    <text x="60" y="179" fill="#94a3b8" font-size="13">问题工作台</text>
    <circle cx="42" cy="223" r="6" fill="#475569"/>
    <text x="60" y="228" fill="#94a3b8" font-size="13">知识与证据</text>
    <circle cx="42" cy="272" r="6" fill="#475569"/>
    <text x="60" y="277" fill="#94a3b8" font-size="13">质量评测</text>
    <circle cx="42" cy="321" r="6" fill="#475569"/>
    <text x="60" y="326" fill="#94a3b8" font-size="13">流程追踪</text>

    <line x1="24" y1="374" x2="204" y2="374" stroke="#1e293b"/>
    <text x="28" y="406" fill="#64748b" font-size="10" font-weight="700" letter-spacing="1">系统状态</text>
    <circle cx="36" cy="437" r="5" fill="#34d399"/>
    <text x="51" y="441" fill="#cbd5e1" font-size="12">资料审核</text>
    <text x="174" y="441" fill="#6ee7b7" font-size="11">正常</text>
    <circle cx="36" cy="470" r="5" fill="#34d399"/>
    <text x="51" y="474" fill="#cbd5e1" font-size="12">知识检索</text>
    <text x="174" y="474" fill="#6ee7b7" font-size="11">正常</text>
    <circle cx="36" cy="503" r="5" fill="#fbbf24"/>
    <text x="51" y="507" fill="#cbd5e1" font-size="12">AI 分析</text>
    <text x="174" y="507" fill="#fde68a" font-size="11">受控</text>

    <rect x="20" y="776" width="188" height="92" rx="14" fill="#101f31" stroke="#20364c"/>
    <text x="36" y="802" fill="#7dd3fc" font-size="10" font-weight="700">公开范围说明</text>
    <text x="36" y="826" fill="#cbd5e1" font-size="11">所有问题、指标和编号</text>
    <text x="36" y="843" fill="#cbd5e1" font-size="11">均为虚构演示数据。</text>
    <text x="36" y="860" fill="#5eead4" font-size="11" font-weight="650">非真实生产系统</text>

    <!-- 顶部 -->
    <rect x="228" width="1212" height="82" fill="url(#hero)"/>
    <text x="264" y="36" class="h1">服务运营辅助台</text>
    <text x="264" y="60" fill="#94a3b8" font-size="12">基于证据的故障分析辅助 · 建议模式</text>
    <rect x="1160" y="24" width="126" height="34" rx="17" fill="#0f3e45" stroke="#2dd4bf" stroke-opacity=".55"/>
    <circle cx="1182" cy="41" r="5" fill="#2dd4bf"/>
    <text x="1198" y="45" fill="#99f6e4" font-size="11" font-weight="700">公开演示</text>
    <circle cx="1346" cy="41" r="18" fill="#233b54"/>
    <text x="1346" y="45" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">值班</text>

    <!-- 内容 -->
    <text x="264" y="119" class="label">运行概览</text>
    <text x="264" y="146" class="h2">知识与分析概览</text>
    <text x="264" y="168" class="small">以下数值仅用于作品集演示</text>

    <g filter="url(#shadow)">
      <rect x="264" y="190" width="246" height="112" rx="16" fill="#fff"/>
      <rect x="528" y="190" width="246" height="112" rx="16" fill="#fff"/>
      <rect x="792" y="190" width="246" height="112" rx="16" fill="#fff"/>
      <rect x="1056" y="190" width="348" height="112" rx="16" fill="#fff"/>
    </g>

    <circle cx="290" cy="218" r="8" fill="#fb7185"/>
    <text x="308" y="222" class="label">待分析问题</text>
    <text x="288" y="266" class="metric">07</text>
    <text x="342" y="264" fill="#be123c" font-size="12" font-weight="650">2 个需补充信息</text>
    <text x="288" y="289" class="small">虚构问题队列</text>

    <circle cx="554" cy="218" r="8" fill="#2dd4bf"/>
    <text x="572" y="222" class="label">证据覆盖率</text>
    <text x="552" y="266" class="metric">91%</text>
    <text x="552" y="289" class="small">仅使用已审核知识</text>

    <circle cx="818" cy="218" r="8" fill="#60a5fa"/>
    <text x="836" y="222" class="label">分析响应 P95</text>
    <text x="816" y="266" class="metric">4.2s</text>
    <text x="816" y="289" class="small">虚构试点负载</text>

    <text x="1082" y="222" class="label">流程健康度</text>
    <text x="1082" y="252" fill="#0f172a" font-size="15" font-weight="700">上传 → 审核 → 检索 → 分析</text>
    <rect x="1082" y="272" width="282" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="1082" y="272" width="247" height="8" rx="4" fill="url(#teal)"/>
    <text x="1338" y="290" class="small">正常</text>

    <!-- 服务问题列表 -->
